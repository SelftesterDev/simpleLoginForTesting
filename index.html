<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auth Test App</title>

<style>
body{
    font-family: Arial;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    display:flex;
    flex-direction:column;
    gap:20px;
    max-width:500px;
    width:100%;
}

.card{
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.2);
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:500;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:10px;
    cursor:pointer;
}

#message{
    margin-top:20px;
    font-weight:bold;
    text-align:center;
}

h1{
    margin:0 0 15px 0;
    font-size:24px;
}

h2{
    margin:0 0 15px 0;
    font-size:20px;
}
</style>
</head>

<body>

<div class="container">
    <div class="card">
        <h1>Pokemon Explorer</h1>

        <label for="pokemon-search">Search by Pokemon Name:</label>
        <input id="pokemon-search" type="text" placeholder="Enter Pokemon name">
        <button onclick="searchPokemon()">Search</button>

        <div id="pokemon-result"></div>
    </div>

    <div class="card">
        <h2>Login</h2>

        <label for="username">Email/Username</label>
        <input id="username" type="text">

        <label for="password">Password</label>
        <input id="password" type="password">

        <button onclick="login()">Login</button>

        <div id="message"></div>
    </div>
</div>

<script>
function searchPokemon(){
    const searchValue = document.getElementById("pokemon-search").value.trim();
    const resultDiv = document.getElementById("pokemon-result");

    if(searchValue === ""){
        resultDiv.textContent = "Please enter a Pokemon name";
        return;
    }

    resultDiv.textContent = "Searching for: " + searchValue;
}

function login(){

    const user =
        document.getElementById("username").value;

    const pass =
        document.getElementById("password").value;

    const msg =
        document.getElementById("message");

    if(
        user === "default@test.com" &&
        pass === "default123"
    ){
        msg.innerHTML =
            "WELCOME DEFAULT USER<br>LOGIN SUCCESSFUL";
        return;
    }

    if(
        user === "override@test.com" &&
        pass === "override123"
    ){
        msg.innerHTML =
            "WELCOME OVERRIDE USER<br>LOGIN SUCCESSFUL";
        return;
    }

    msg.innerHTML =
        "INVALID CREDENTIALS";
}
</script>

</body>
</html>
