<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auth Test App</title>

<style>
*{
    box-sizing:border-box;
}

body{
    font-family: Arial;
    background:#f5f5f5;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:flex-start;
    min-height:100vh;
    padding:20px;
    gap:20px;
}

.card{
    background:white;
    padding:30px;
    border-radius:10px;
    width:350px;
    box-shadow:0 2px 10px rgba(0,0,0,.2);
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:10px;
    cursor:pointer;
    min-height:44px;
}

#message{
    margin-top:20px;
    font-weight:bold;
    text-align:center;
}

#pokemon-result{
    margin-top:20px;
    font-weight:bold;
    text-align:center;
}

@media (max-width: 768px) {
    body {
        flex-direction:column;
        align-items:center;
    }

    .card {
        width:100%;
        max-width:350px;
    }
}
</style>
</head>

<body>

<div class="card">
    <h2>Pokemon Explorer</h2>

    <label for="pokemon-search">Search by Pokemon Name:</label>
    <input id="pokemon-search" type="text" placeholder="Enter Pokemon name">

    <button onclick="searchPokemon()">Search</button>

    <div id="pokemon-result"></div>
</div>

<div class="card">
    <h2>Login</h2>

    <label for="username">Email/Username</label>
    <input id="username" type="text">

    <label for="password">Password</label>
    <input id="password" type="password">

    <button onclick="login()">Login</button>

    <div id="message"></div>
</div>

<script>
function searchPokemon(){
    const pokemonName =
        document.getElementById("pokemon-search").value;

    const result =
        document.getElementById("pokemon-result");

    if(!pokemonName || pokemonName.trim() === ""){
        result.innerHTML =
            "Please enter a Pokemon name";
        return;
    }

    result.textContent =
        "Searching for: " + pokemonName;
}

function login(){

    const user =
        document.getElementById("username").value;

    const pass =
        document.getElementById("password").value;

    const msg =
        document.getElementById("message");

    if(
        user === "default@test.com" &&
        pass === "default123"
    ){
        msg.innerHTML =
            "WELCOME DEFAULT USER<br>LOGIN SUCCESSFUL";
        return;
    }

    if(
        user === "override@test.com" &&
        pass === "override123"
    ){
        msg.innerHTML =
            "WELCOME OVERRIDE USER<br>LOGIN SUCCESSFUL";
        return;
    }

    msg.innerHTML =
        "INVALID CREDENTIALS";
}
</script>

</body>
</html>
